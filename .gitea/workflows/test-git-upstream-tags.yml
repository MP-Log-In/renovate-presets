name: Git Upstream Tag Preset Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test tag tracking and update rules
        run: node --test tests/gitUpstreamTagsMk.test.mjs
